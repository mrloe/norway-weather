# One-off check: compares cities.json with Kartverket's place-name register.
# Run it from the Actions tab (Run workflow). Read the result in the job log.
name: check-coords
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_coords.py
